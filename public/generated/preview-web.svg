<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 52" fill="none">
  <!-- Browser frame -->
  <rect x="1" y="1" width="78" height="50" rx="5" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
  <!-- Toolbar -->
  <rect x="1" y="1" width="78" height="12" rx="5" fill="rgba(96,165,250,0.08)"/>
  <rect x="7" y="1" width="78" height="6" fill="rgba(96,165,250,0.08)"/>
  <!-- Window dots -->
  <circle cx="8" cy="7" r="2" fill="rgba(255,255,255,0.2)"/>
  <circle cx="14" cy="7" r="2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="20" cy="7" r="2" fill="rgba(255,255,255,0.1)"/>
  <!-- URL bar -->
  <rect x="26" y="4" width="42" height="6" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <!-- Page content: hero block -->
  <rect x="6" y="17" width="68" height="9" rx="2" fill="rgba(96,165,250,0.12)"/>
  <!-- Content rows -->
  <rect x="6" y="29" width="44" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="6" y="34" width="34" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
  <rect x="6" y="39" width="52" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
  <!-- CTA button -->
  <rect x="6" y="44" width="22" height="5" rx="2.5" fill="rgba(52,211,153,0.25)" stroke="rgba(52,211,153,0.3)" stroke-width="0.5"/>
</svg>
