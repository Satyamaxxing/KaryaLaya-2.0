  <rect x="22" y="43.5" width="2" height="5" rx="1" fill="rgba(167,139,250,0.45)"/>
  <rect x="26" y="44" width="2" height="4" rx="1" fill="rgba(167,139,250,0.4)"/>
  <rect x="30" y="42.5" width="2" height="7" rx="1" fill="rgba(167,139,250,0.55)"/>
  <rect x="34" y="44" width="2" height="4" rx="1" fill="rgba(167,139,250,0.4)"/>
  <rect x="38" y="45" width="2" height="2" rx="1" fill="rgba(167,139,250,0.3)"/>
